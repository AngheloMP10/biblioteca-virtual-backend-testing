spring.application.name=biblioteca-virtual

server.port=8080

jwt.expiration=86400000

# Pool de conexiones HikariCP. Por defecto son 10: con 100 VUs las peticiones hacen cola esperando
# una conexion y, pasado connection-timeout (30 s), fallan. Si el perfil prod usa un proveedor de BD
# con pocas conexiones permitidas, sobreescribir estos valores en application-prod.properties.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10